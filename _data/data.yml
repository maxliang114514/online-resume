  title: 项目经历
  items:
    - name: 思维链（CoT）分布外组合泛化理论（NeurIPS 2026 Poster）
      link:
      date: 2025.05 - 至今
      description: |
        + 用 Rademacher complexity 分析 CoT 分布外泛化机制：单步数据即可泛化至长链组合任务
        + 建立理论框架：给出 **O(√(T/n))** 泛化误差界并完成实验验证；研究「基于当前状态逐步推理」结构，CoT 仅其一例，Agent 逐步执行属同一结构

    - name: Q-VeRA 大模型高效微调设计
      link:
      date: 2024.11 - 2025.05
      description: |
        + 结合 Q-LoRA 与 VeRA 的优势，对高效大语言模型微调方法进行了改进
        + 在 **MMLU、GLUE** 等主流测试集上准确率与基线相当（**1%** 以内）
        + 微调阶段的内存占用相较 Q-LoRA 与 VeRA 分别降低 **20%**、**45%**

    - name: Webpilot 网页生成智能体（Agent）设计（Smiles 机器学习国际暑期学校项目）
      link:
      date: 2026.07
      description: |
        + 基于 **Webcompass** 网页生成任务（benchmark）进行 Agent 设计（项目导师：刘佳恒助理教授）
        + 设计了一个能自我管理"计划-执行-检测-修复"的全流程 Agent
        + 相较模型直接生成在 Webcompass 上得分提升超过 **20%**，且耗时得到有效控制（qwen3.7-plus）

    - name: LLM Agent 长程推理与强化学习理论
      link:
      date: 2026.08 - 至今
      description: |
        + 面向长程任务的组合爆炸与可靠性难题，将数学智能体的分解—求解—验证机制推广至通用 Agent
        + 借鉴 Sonoda 系列工作，基于状态中心决策过程（SDP）构建规划—执行—验证分析框架
        + 推导结构化任务下的条件性成功率界，分析局部采样缓解长链执行成本的条件

