project:
  show: true
  order: 3
  title: 项目经历
  items:
    - name: 思维链分布外组合泛化理论（NeurIPS 2026 一作｜PyTorch·理论分析·vLLM·LoRA）
      link: https://arxiv.org/abs/2611.06438
      date: 2025.05 - 至今
      description: |
        + 将大模型推理行为拆解为逐个步骤输出，用 Rademacher complexity 分析 CoT 分布外泛化机制：单步数据即可泛化至长链组合任务，给出 O(√(T/n)) 误差界与匹配下界
        + 自建 Atom-Task 数据集：设计单步与多步 4 种训练组合，用于分离"单步数据"对长链泛化的贡献，在 Qwen3-4B、Llama2-7B 上验证，3 seeds 重复并报告均值±标准差
        + 论文与代码：[arxiv.org/abs/2611.06438](https://arxiv.org/abs/2611.06438) ｜ [github.com/maxliang114514/CoT-OOD](https://github.com/maxliang114514/CoT-OOD)
        + 研究的是「基于当前状态逐步推理」结构，CoT 仅其一例，Agent 逐步执行属同一结构

    - name: Q-VeRA 大模型高效微调设计（PyTorch·LoRA·量化）
      link:
      date: 2024.11 - 2025.05
      description: |
        + 结合 Q-LoRA 与 VeRA 的优势，对高效大语言模型微调方法进行了改进
        + 基于 Llama2-7B 等模型，在 MMLU、GLUE 等主流测试集上准确率与基线相当（1% 以内）
        + 微调阶段的内存占用相较 Q-LoRA 与 VeRA 方法分别降低 20%、45%

    - name: Webpilot 网页生成智能体（Agent）设计（Python·Agent·多模型评测）
      link:
      date: 2026.07
      description: |
        + 基于 WebCompass 网页生成基准实现"计划-生成-检测-修复"四阶段流水线（项目导师：刘佳恒助理教授）
        + 以 Playwright 渲染后的整页与视口截图作为视觉反馈，驱动 VLM 按可运行性 / 规格实现度 / 设计质量三维度评分；最多3轮的修复阶段输出 search/replace 增量补丁，只改失败项而非重生成整个项目
        + 相较单次生成，文本/图像模态综合得分由 0.688/0.837 提升至 0.905/0.924（各 10 个任务），单任务 3–9 次 API 调用

- name: 基于步骤与模块分解的 Agent 长程推理理论（理论分析·Agent·GRPO）
  link:
  date: 2026.08 - 至今
  description: |
    + 面向长程任务的组合爆炸与可靠性问题，将 Agent 执行刻画为「规划器提目标、执行器实现、状态转移推进」的循环
    + 在步骤分解（CoT）基础上引入模块分解：把可复用的执行环节独立出来，以降低长链任务的样本复杂度
    + 证明两个模块的样本复杂度不同阶（执行器 √(T/n)、规划器 T/√n），差异源于执行器数据可按层独立采集
    + 目前在 TextCraft-Synth 上以 Qwen 搭建该分层 Agent，分阶段训练并分别评测执行器与规划器的误差

