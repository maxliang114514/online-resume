project:
  show: true
  order: 3
  title: 项目经历
  items:
    - name: 思维链（CoT）分布外组合泛化理论 · NeurIPS 2026 已录用（第一作者）
      link:                        # ← arXiv 挂上后填这里
      date: 2025.05 - 至今
      description: |
        + 基于 Rademacher complexity 等机器学习理论，分析 CoT 让模型实现分布外泛化的理论机制
        + 证明 CoT 仅依赖单步数据及分布外短链数据，即可泛化到缺少数据的目标长链组合任务分布
        + 给出 **O(√(T/n))** 泛化误差界，并用 parity-coupled 构造给出**匹配下界**，说明该率不是估计的假象
        + 实验发现：**去掉显式状态追踪，组合泛化即失效**——同一批数据、不同组织方式，效果截然不同

    - name: Q-VeRA 大模型高效微调设计
      link:
      date: 2024.11 - 2025.05
      description: |
        + 结合 Q-LoRA 与 VeRA 的优势（量化基座 + 共享低秩投影），改进高效大语言模型微调方法
        + 在 **MMLU、GLUE** 等主流测试集上准确率与基线相当（**1%** 以内）
        + **训练阶段显存占用**相较 Q-LoRA 与 VeRA 分别降低 **20%**、**45%**

    - name: Webpilot 网页生成智能体（Agent）设计（Smiles 机器学习国际暑期学校）
      link:
      date: 2026.07
      description: |
        + 基于 **WebCompass** 网页生成 benchmark 进行 Agent 设计（项目导师：刘佳恒助理教授）
        + 设计能自我管理"计划-执行-检测-修复"闭环的全流程 Agent
        + 相较模型直接生成在 WebCompass 上得分提升超过 **20%**，耗时得到有效控制（qwen-plus）

    - name: LLM Agent 长程推理与强化学习理论
      link:
      date: 2026.08 - 至今
      description: |
        + 面向长程任务的组合爆炸与可靠完成难题，将数学证明智能体的分解、局部求解与验证机制推广至通用 Agent
        + 借鉴 Sonoda 系列工作，基于状态中心决策过程（State-Centric Decision Process, SDP）构建**规划—执行—验证**分析框架
        + 推导结构化任务下的条件性成功率界，分析局部采样缓解长链执行成本的条件

