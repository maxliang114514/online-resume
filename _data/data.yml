project:
  show: true
  order: 3
  title: 项目经历
  items:
    - name: CoT在训练和推理阶段的应用对于大模型组合泛化的影响机制
      link:
      date: 2025.05 - 至今
      description: |
        基于rademacher complexity等机器学习理论，分析CoT让模型实现组合泛化的理论机制
        + 对于缺少数据的长链组合任务，通过单步数据及分布外短链数据，让LLM泛化到目标长链任务的分布
        + 相较以往工作，建立了一套更完善的理论框架，进行了相尽的实验设计和分析
        + 目前正在完善实验工作，预计上半年投出

    - name: Q-VeRA 大模型高效微调设计
      link:
      date: 2024.11 - 2025.05
      description: |
        结合Q-LoRA与VeRA的优势，对高效大语言模型微调方法进行了改进。
        + 在 MMLU、GLUE 等主流测试集上性能与基线模型相当。
        + 显著优化了微调阶段的内存占用。

    - name: “区块链+三方演化博弈”课题研究
      link:
      date: 2023.09 - 2024.09
      description: |
        研究并改进区块链共识协议 (如 PBFT) 的激励机制，以提升网络的安全性与稳定性。
        + 成果已发表于 SCI 期刊《Cluster Computing》(JCR Q2)。
        + 参与“区块链+博弈”讨论班 (邓小铁教授主持)，研讨自私挖矿攻击等课题。

