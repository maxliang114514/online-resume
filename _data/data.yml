project:
  show: true
  order: 3
  title: 项目经历
  items:
    - name: CoT在训练和推理阶段的应用对于大模型的分布外泛化的影响机制研究
      link:
      date: 2025.05 - 2026.05
      description: |
        基于rademacher complexity等机器学习理论，分析CoT让模型实现分布外泛化的理论机制
        + 证明CoT能仅依赖单步数据及分布外短链数据，让LLM泛化到缺少数据的目标长链组合任务分布
        + 建立了一套更完善的理论框架，给出了**O(sqrt(T/n))**泛化误差界并进行了详尽的实验分析
        + 目前已投稿至机器学习国际顶会（正在同行评审中）
        
    - name: Q-VeRA 大模型高效微调设计
      link:
      date: 2024.11 - 2025.05
      description: |
        结合Q-LoRA与VeRA的优势，对高效大语言模型微调方法进行了改进
        + 在 MMLU、GLUE 等主流测试集上准确率与基线相当（**1%**以内）
        + 微调阶段的内存占用相较Q-LoRA与VeRA分别降低**20%**、**45%**

    - name: Webpliot网页生成智能体（agent）设计（Smiles机器学习国际暑期学校项目）
      link:
      date: 2026.07 - 2026.07
      description: |
        基于Webcompass网页生成任务（benchmark）进行agent设计（项目导师：刘佳恒助理教授）
        + 设计了一个能自我管理“计划-执行-检测-修复”的全流程agent
        + 相较模型直接生成在Webcompass上得分提升超过**20%**，且耗时得到有效控制（qwen3.7-plus）
        
    - name: CoT与强化学习结合的推理机制研究
      link:
      date: 2026.05 - 至今
      description: |
        对RL算法增强大模型长链推理能力的前沿研究（例如deepseek-R1），致力于进行较为系统的理论分析
        + 对于PPO/GRPO/RLVR/RLHF等强化学习方法进行了系统调研与分析，寻找缺乏理论解释的痛点
        + 目前处于初步探索阶段，准备根据目前研究的空白（例如推理路径单一化等）寻找切入点
        
