project:
  show: true
  order: 3
  title: 项目经历
  items:
    - name: CoT在训练和推理阶段的应用对于大模型的分布外泛化的影响机制研究
      link:
      date: 2025.05 - 2026.05
      description: |
        基于rademacher complexity等机器学习理论，分析CoT让模型实现分布外泛化的理论机制
        + 对于缺少数据的长链组合任务，通过单步数据及分布外短链数据，让LLM泛化到目标长链任务分布
        + 相较以往工作，建立了一套更完善的理论框架，给出了具体的泛化误差界，进行了相尽的实验设计和分析
        + 目前已投稿至机器学习国际顶会（正在同行评审中）

    - name: CoT在RL设定下的理论机制分析
      link:
      date: 2026.05 - 至今
      description: |
        对于目前通过RL算法增强大模型长链推理能力的前沿研究（例如deepseek-R1)，尝试进行较为系统的理论分析
        + 对于PPO/GRPO/RLVR/RLHF等强化学习方法进行了系统调研与学习
        + 目前处于初步探索阶段，准备根据目前研究的痛点（例如推理路径单一化等）寻找切入点
        
    - name: Q-VeRA 大模型高效微调设计
      link:
      date: 2024.11 - 2025.05
      description: |
        结合Q-LoRA与VeRA的优势，对高效大语言模型微调方法进行了改进
        + 在 MMLU、GLUE 等主流测试集上性能与基线相当
        + 显著优化了微调阶段的内存占用



    

